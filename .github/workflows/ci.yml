name: Intel Sender CI

on:
  workflow_dispatch:
  push:
    branches: [intel-sender]
  pull_request:
    branches: [intel-sender]

jobs:
  sender-x86-64:
    name: Sender tests and package (x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check localizations
        run: ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Run Sender unit tests
        working-directory: TargetBridge-Sender
        run: |
          xcodebuild test \
            -project TargetBridge.xcodeproj \
            -scheme TBDisplaySender \
            -configuration Debug \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath .build/DerivedData \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

      - name: Build Intel Sender package
        run: TargetBridge-Sender/scripts/build_intel_sender_app.sh

      - name: Validate package identity
        run: |
          APP='build-intel/TargetBridge Intel Sender.app'
          file "$APP/Contents/MacOS/TargetBridge Intel Sender" | grep 'x86_64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.targetbridge.intel-sender'
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload test package
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-Intel-Sender-x86_64-ci
          path: build-intel/TargetBridge Intel Sender.app
          retention-days: 7
