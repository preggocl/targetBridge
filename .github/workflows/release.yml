name: Intel Sender Prerelease

on:
  push:
    tags:
      - 'v*-intel.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-intel-sender:
    name: Build Intel Sender release artifacts
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check localizations
        run: ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Run Sender unit tests
        working-directory: TargetBridge-Sender
        run: |
          xcodebuild test \
            -project TargetBridge.xcodeproj \
            -scheme TBDisplaySender \
            -configuration Debug \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath .build/DerivedData \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

      - name: Package ZIP and DMG
        run: TargetBridge-Sender/scripts/package_intel_sender_release.sh '${{ steps.version.outputs.value }}'

      - name: Generate provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.version.outputs.value }}/TargetBridge-Intel-Sender-*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-Intel-Sender-${{ steps.version.outputs.value }}
          path: dist/${{ steps.version.outputs.value }}/*
          retention-days: 7

  publish-prerelease:
    name: Publish GitHub prerelease
    needs: build-intel-sender
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: TargetBridge-Intel-Sender-${{ steps.version.outputs.value }}
          path: artifacts

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --verify-tag \
            --prerelease \
            --title "TargetBridge Intel Sender ${{ steps.version.outputs.value }}" \
            --notes-file docs/Release-3.3.0-intel.1.md
